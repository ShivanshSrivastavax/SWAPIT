services:
  server:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      PORT: 4100
      CLIENT_URL: http://localhost:4173
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./server/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
    ports:
      - '4100:4100'
